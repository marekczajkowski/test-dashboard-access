apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: cache-control-web-resources
  namespace: so-ds-gateway-e0b12
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: sx-mesh-streamx-gateway-web-server-route
  lua:
    - type: Inline
      inline: |
        function envoy_on_response(response_handle)
            local content_type = response_handle:headers():get("content-type")
            if content_type and not (content_type:find("text/html") or content_type:find("text/xml")) then
                response_handle:headers():replace("Cache-Control", "must-revalidate, public, max-age=31536000")
            end
        end