default:
  environment:
    STREAMX_BLUEPRINTS_KEY_VALUE_STATE_REPOSITORY_BACKEND: rocksdb
    STREAMX_BLUEPRINTS_KEY_VALUE_STATE_REPOSITORY_ROCKSDB_PATH: /var/lib/rocksdb

descriptors:
  relay:
    type: processing
    containers:
      service:
        incoming:
          events: {}
        outgoing:
          relayed-events: {}

  sitemap-generator:
    type: processing
    volumes:
      rocksdb:
        size: 5Gi
    containers:
      processor:
        image: ghcr.io/streamx-com/streamx-blueprints/sitemap-generator:3.0.13-native
        incoming:
          incoming-pages: {}
        outgoing:
          outgoing-sitemaps: {}
        autoRef:
          - from: incoming-pages
            to: incoming-pages-state
            using: sync-state
        volumes:
          - rocksdb:/var/lib/rocksdb
  
  web-server-sink:
    type: edge
    volumes:
      repository-volume:
        size: 5Gi
    containers:
      sink:
        image: ghcr.io/streamx-com/streamx-blueprints/web-server-sink:3.0.13-native
        incoming:
          resources: {}
        servicePorts:
          - 8081:8080
        volumes:
          - repository-volume:/srv/www
        environment:
          STREAMX_BLUEPRINTS_WEB_SERVER_SINK_STORAGE_ROOT_DIRECTORY: /srv/www
      webserver:
        image: registry.streamx.cloud/streamx-docker-hub-public-proxy/library/nginx:1.26.0
        servicePorts:
          - 8084:80
        volumes:
          - repository-volume:/usr/share/nginx/html
networking:
  httpRoutes:
    ingestion-route:
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - name: ingestion/rest-ingestion
              port: 8080
    web-server-route:
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - name: edge/web-server-sink
              port: 8084

sources:
  websight:
    outgoing:
      - ref: inbox.pages
        produces:
          - com.streamx.blueprints.page.published.v1
          - com.streamx.blueprints.page.unpublished.v1
      - ref: inbox.assets
        produces:
          - com.streamx.blueprints.asset.published.v1
          - com.streamx.blueprints.asset.unpublished.v1
      - ref: inbox.web-resources
        produces:
          - com.streamx.blueprints.web-resource.published.v1
          - com.streamx.blueprints.web-resource.unpublished.v1

ingestion:
  rest-ingestion:
    containers:
      proxy:
        environmentFrom:
          configs:
            - rest-ingestion.properties
        environment:
          # Ensures that generated tokens would work between cluster restarts
          STREAMX_SOURCES_WEBSIGHT_ACCEPT_IAT_FROM: "1704067200"

processing:
  web-resources-relay:
    descriptor: relay
    containers:
      service:
        incoming:
          events:
            ref: inbox.web-resources
        outgoing:
          relayed-events:
            ref: outbox.web-resources

  assets-relay:
    descriptor: relay
    containers:
      service:
        incoming:
          events:
            ref: inbox.assets
        outgoing:
          relayed-events:
            ref: outbox.assets

  pages-relay:
    descriptor: relay
    containers:
      service:
        incoming:
          events:
            ref: inbox.pages
        outgoing:
          relayed-events:
            ref: outbox.pages

  sitemap-generator:
    descriptor: sitemap-generator
    containers:
      processor:
        incoming:
          incoming-pages:
            ref: inbox.pages
        outgoing:
          outgoing-sitemaps:
            ref: outbox.web-resources
        environment:
          STREAMX_BLUEPRINTS_SITEMAP_GENERATOR_BASE-URL: https://ds.pl
          STREAMX_BLUEPRINTS_SITEMAP_GENERATOR_OUTPUT-KEY: /sitemap.xml
          STREAMX_BLUEPRINTS_SITEMAP_GENERATOR_OUTPUT-TYPE: web-resource/sitemap

edge:
  web-server-sink:
    descriptor: web-server-sink
    containers:
      sink:
        incoming:
          resources:
            ref: outbox.pages,outbox.assets,outbox.web-resources
        environmentFrom:
          configs:
            - web-server-sink.properties
      webserver:
        volumesFrom:
          configs:
            - nginx_conf/ds-pl.conf:/etc/nginx/conf.d/default.conf
            - nginx_conf/includes/compression.conf:/etc/nginx/conf.d/includes/compression.conf
            - nginx_conf/includes/ensure-https.conf:/etc/nginx/conf.d/includes/ensure-https.conf