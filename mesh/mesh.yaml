default:
  environment:
    # Favor throughput and connection quality over latency
    PULSAR_CLIENT_USETCPNODELAY: "false"
    STREAMX_BLUEPRINTS_KEY_VALUE_STATE_REPOSITORY_BACKEND: rocksdb
    STREAMX_BLUEPRINTS_KEY_VALUE_STATE_REPOSITORY_ROCKSDB_PATH: /var/lib/rocksdb

descriptors:
  web-server-sink:
    type: edge
    volumes:
      repository-volume:
        size: 5Gi
    containers:
      sink:
        image: ghcr.io/streamx-com/streamx-blueprints/web-server-sink:3.0.13-native
        incoming:
          resources: {}
        servicePorts:
          - 8081:8080
        volumes:
          - repository-volume:/srv/www
        environment:
          STREAMX_BLUEPRINTS_WEB_SERVER_SINK_STORAGE_ROOT_DIRECTORY: /srv/www
      webserver:
        image: registry.streamx.cloud/streamx-docker-hub-public-proxy/library/nginx:1.26.0
        servicePorts:
          - 8084:80
        volumes:
          - repository-volume:/usr/share/nginx/html
networking:
  httpRoutes:
    ingestion-route:
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - name: ingestion/rest-ingestion
              port: 8080
    web-server-route:
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - name: edge/web-server-sink
              port: 8084

sources:
  websight:
    outgoing:
      - ref: inbox.pages
        produces:
          - com.streamx.blueprints.page.published.v1
          - com.streamx.blueprints.page.unpublished.v1
      - ref: inbox.assets
        produces:
          - com.streamx.blueprints.asset.published.v1
          - com.streamx.blueprints.asset.unpublished.v1
      - ref: inbox.web-resources
        produces:
          - com.streamx.blueprints.web-resource.published.v1
          - com.streamx.blueprints.web-resource.unpublished.v1

ingestion:
  rest-ingestion:
    containers:
      proxy:
        environment:
          # Ensures that generated tokens would work between cluster restarts
          STREAMX_SOURCES_WEBSIGHT_ACCEPT_IAT_FROM: "1704067200"

processing:
  sitemap-generator:
    descriptor: sitemap-generator
    containers:
      processor:
        incoming:
          incoming-pages:
            ref: inbox.pages
        outgoing:
          outgoing-sitemaps:
            ref: outbox.web-resources
        environment:
          STREAMX_BLUEPRINTS_SITEMAP_GENERATOR_BASE_URL: https://ds.pl
          STREAMX_BLUEPRINTS_SITEMAP_GENERATOR_OUTPUT_KEY: /sitemap.xml

edge:
  web-server-sink:
    descriptor: web-server-sink
    containers:
      sink:
        incoming:
          resources:
            ref: inbox.pages,inbox.assets,inbox.web-resources,outbox.web-resources
        environmentFrom:
          configs:
            - web-server-sink.properties

      webserver:
        volumesFrom:
          configs:
            - nginx_conf/default.conf:/etc/nginx/conf.d/default.conf
            - nginx_conf/ds-pl.conf:/etc/nginx/conf.d/ds-pl.conf
            - nginx_conf/includes/compression.conf:/etc/nginx/includes/compression.conf
            - nginx_conf/includes/ensure-https.conf:/etc/nginx/includes/ensure-https.conf