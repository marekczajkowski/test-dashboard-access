descriptors:
  relay:
    type: processing
    containers:
      service:
        incoming:
          events: {}
        outgoing:
          relayed-events: {}

 
  web-server-sink:
    type: edge 
    containers:
      sink:
        image: ghcr.io/streamx-com/streamx-blueprints/web-server-sink:3.0.7-jvm
        incoming:
          resources: {}
        environment:
          STREAMX_BLUEPRINTS_WEB_SERVER_SINK_STORAGE_ROOT_DIRECTORY: /srv/www
        volumes:
          - repository-volume:/srv/www
      webserver:
        image: docker.io/library/nginx:1.26.0
        servicePorts:
          - 80:80
        volumes:
          - repository-volume:/usr/share/nginx/html
        healthCheck: null
    volumes: 
      repository-volume: {}

sources:
  cli:
    outgoing:
      - ref: inbox.pages
        produces:
          - com.streamx.blueprints.page.published.v1
          - com.streamx.blueprints.page.unpublished.v1

gateways:
  - httpRoutes:
      - name: ingestion
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /ingest
            backendRefs:
              - name: ingestion/rest-ingestion
                port: 8080
            filters:
              - type: URLRewrite
                urlRewrite:
                  path:
                    type: ReplacePrefixMatch
                    replacePrefixMatch: /
      - name: web
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /web
            backendRefs:
              - name: edge/web-server-sink-service
                port: 80
            filters:
              - type: URLRewrite
                urlRewrite:
                  path:
                    type: ReplacePrefixMatch
                    replacePrefixMatch: /

ingestion:
  rest-ingestion:
    containers:
      proxy:
        environment:
processing:
  pages-relay:
    descriptor: relay
    containers:
      service:
        incoming:
          events:
            ref: inbox.pages
        outgoing:
          relayed-events:
            ref: outbox.pages

edge:
  web-server-sink-service:
    descriptor: web-server-sink
    containers:
      sink:
        incoming:
          resources:
            ref: outbox.pages
      webserver:
        volumesFrom:
          configs: 
