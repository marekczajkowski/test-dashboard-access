---
descriptors:
  relay:
    type: "processing"
    containers:
      service:
        incoming:
          events: {}
        outgoing:
          relayed-events: {}
  web-server-sink:
    type: "edge"
    containers:
      sink:
        image: "ghcr.io/streamx-com/streamx-blueprints/web-server-sink:3.0.7-jvm"
        incoming:
          resources: {}
        environment:
          STREAMX_BLUEPRINTS_WEB_SERVER_SINK_STORAGE_ROOT_DIRECTORY: "/srv/www"
        volumes:
        - "repository-volume:/srv/www"
      webserver:
        image: "docker.io/library/nginx:1.26.0"
        volumes:
        - "repository-volume:/usr/share/nginx/html"
        servicePorts:
        - "80:80"
    volumes:
      repository-volume: {}
ingestion:
  rest-ingestion:
    containers:
      proxy: {}
sources:
  resources-source:
    outgoing:
    - ref: "inbox.pages"
      produces:
      - "com.streamx.blueprints.page.published.v1"
      - "com.streamx.blueprints.page.unpublished.v1"
processing:
  pages-relay:
    descriptor: "relay"
    containers:
      service:
        incoming:
          events:
            ref: "inbox.pages"
        outgoing:
          relayed-events:
            ref: "outbox.pages"
edge:
  web-server-sink-service:
    descriptor: "web-server-sink"
    containers:
      sink:
        incoming:
          resources:
            ref: "outbox.pages"
        environment:
          A: "1"
        environmentFrom:
          secrets:
            - secret.properties
            - test/secret.properties
          configs:
            - test.properties
      webserver:
        volumesFrom: {}
gateways:
- httpRoutes:
  - name: "ingestion"
    rules:
    - backendRefs:
      - name: "ingestion/rest-ingestion"
        port: 8080
      filters:
      - type: "URLRewrite"
        urlRewrite:
          path:
            replacePrefixMatch: "/"
            type: "ReplacePrefixMatch"
      matches:
      - path:
          type: "PathPrefix"
          value: "/ingest"
  - name: "web"
    rules:
    - backendRefs:
      - name: "edge/web-server-sink"
        port: 8083
      filters:
      - type: "URLRewrite"
        urlRewrite:
          path:
            replacePrefixMatch: "/"
            type: "ReplacePrefixMatch"
      matches:
      - path:
          type: "PathPrefix"
          value: "/web"
